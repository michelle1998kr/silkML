media:
  - name: designs
    label: 디자인 사진 / Design photos
    input: assets/designs
    output: assets/designs
    categories: [image]
  - name: fabrics
    label: 원단 컬러북 / Fabric color books
    input: assets/fabrics
    output: assets/fabrics
    categories: [image]

components:
  localized:
    type: object
    fields:
      - {name: ko, label: 한국어, type: string, required: true}
      - {name: en, label: English, type: string, required: true}

content:
  - name: designs
    label: 디자인 / Designs
    type: collection
    path: src/content/designs
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: id
      fields: [id, slug, category, published, order]
      sort: order
      order: asc
    fields:
      - name: id
        label: 디자인 코드 / Stable design ID
        type: string
        required: true
        description: "예: ML-15. 기존 코드는 변경하지 마세요 / Do not change existing IDs."
      - name: slug
        label: 페이지 주소 / URL slug
        type: string
        required: true
        description: "소문자 영문과 하이픈 / Lowercase English and hyphens only."
      - name: name
        label: 디자인 이름 / Name
        component: localized
      - name: description
        label: 설명 / Description
        type: object
        fields:
          - {name: ko, label: 한국어, type: text, required: true}
          - {name: en, label: English, type: text, required: true}
      - name: category
        label: 카테고리 / Category
        type: select
        required: true
        options:
          values:
            - {name: dress, label: 드레스 / Dresses}
            - {name: top, label: 탑 & 블라우스 / Tops}
            - {name: trouser, label: 트라우저 / Trousers}
      - name: image
        label: 사진 / Photo
        type: image
        required: true
        options: {media: designs}
      - name: fabrics
        label: 실크 종류 / Silks
        type: select
        default: [suzhou, ruby]
        options:
          multiple: true
          min: 1
          values:
            - {name: suzhou, label: 수저우 / Suzhou}
            - {name: ruby, label: 루비 / Ruby}
      - name: priceMin
        label: 최소 가격 (KRW) / Minimum price
        type: number
        description: "가격 문의로 표시하려면 두 가격을 모두 비워두세요. / Leave both prices empty for Ask for pricing."
      - {name: priceMax, label: 최대 가격 (KRW) / Maximum price, type: number}
      - {name: order, label: 정렬 순서 / Display order, type: number, default: 50, required: true}
      - {name: featured, label: 추천 디자인 / Featured, type: boolean, default: false}
      - {name: published, label: 공개 / Published, type: boolean, default: false}
      - name: reviews
        label: 착용 모습 & 관련 게시물 / Instagram & Threads posts
        description: "게시물마다 제목과 공유 링크를 추가하세요. 저장한 순서대로 표시돼요. / Add a title and share link for each post, in display order."
        type: object
        list: true
        fields:
          - {name: label, label: 제목 / Label, component: localized}
          - {name: url, label: 게시물 주소 / Post URL, type: string, required: true}
  - name: fabrics
    label: 실크 & 컬러 / Silks and colors
    type: file
    path: src/content/fabrics.json
    format: json
    list: true
    fields:
      - name: id
        label: 실크 코드 / Silk ID
        type: select
        options: {values: [suzhou, ruby]}
      - {name: name, label: 이름 / Name, component: localized}
      - name: description
        label: 설명 / Description
        type: object
        fields:
          - {name: ko, label: 한국어, type: text, required: true}
          - {name: en, label: English, type: text, required: true}
      - name: colors
        label: 컬러 / Colors
        type: object
        list: true
        fields:
          - {name: id, label: 고유 컬러 ID / Stable color ID, type: string, required: true}
          - {name: code, label: 컬러북 코드 / Color book code, type: string, required: true}
          - {name: name, label: 이름 / Name, component: localized}
          - {name: hex, label: 화면 표시 색상 / Hex color, type: string, required: true}
      - name: charts
        label: 원본 컬러북 / Original color books
        type: image
        list: true
        options: {media: fabrics}
  - name: settings
    label: 스토어 설정 / Store settings
    type: file
    path: src/content/settings.json
    format: json
    fields:
      - {name: instagram, label: Instagram ID, type: string, required: true}
      - {name: threads, label: Threads ID, type: string, required: true}
      - {name: currency, label: 통화 / Currency, type: string, default: KRW, readonly: true}
      - {name: defaultLocale, label: 기본 언어 / Default language, type: string, default: ko, readonly: true}
      - {name: brand, label: 스토어 이름 / Store name, type: string, required: true, readonly: true}
